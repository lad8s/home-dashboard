<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/nextcloud.svg">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Apply the saved theme before the first paint (no flash).
    const t = localStorage.getItem('theme');
    if (t) document.documentElement.dataset.theme = t;
  </script>
</head>
<body>
  <header class="bar">
    <h1>Home</h1>
    <div class="segmented" role="group" aria-label="Where are you?">
      <button type="button" data-mode="home">Home</button>
      <button type="button" data-mode="away">Away</button>
    </div>
    <div class="actions">
      <button type="button" id="theme" class="round" aria-label="Switch light or dark mode">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
      <a href="/api/logout" class="round" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
      </a>
    </div>
  </header>

  <main>
    <p id="where" class="where"></p>
    <h2>Daily</h2>
    <section id="daily" class="grid"></section>
    <h2>All apps</h2>
    <section id="all" class="grid"></section>
  </main>

  <script src="/apps.js"></script>
</body>
</html>
